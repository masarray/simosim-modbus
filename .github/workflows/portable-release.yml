name: Windows portable EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Validate HMI.Controls dependency
        shell: pwsh
        env:
          HMI_CONTROLS_DLL_BASE64: ${{ secrets.HMI_CONTROLS_DLL_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HMI_CONTROLS_DLL_BASE64)) {
            throw "Missing secret HMI_CONTROLS_DLL_BASE64. Set it to base64 of the original HMI.Controls.dll (see PORTABLE_RELEASE.md)."
          }
          New-Item -ItemType Directory -Force Dependencies | Out-Null
          try {
            $bytes = [Convert]::FromBase64String($env:HMI_CONTROLS_DLL_BASE64.Trim())
            [IO.File]::WriteAllBytes((Join-Path $PWD "Dependencies/HMI.Controls.dll"), $bytes)
            if ($bytes.Length -lt 1024) { throw "HMI.Controls.dll is unexpectedly small" }
          } catch {
            throw "HMI.Controls.dll secret is invalid: $($_.Exception.Message)"
          }

      - name: Restore NuGet dependencies
        shell: pwsh
        run: |
          nuget restore SimoSim.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release with Costura embedding
        shell: pwsh
        run: |
          msbuild SimoSim.sln /restore /t:Rebuild /m /p:RestorePackagesConfig=true /p:Configuration=Release /p:Platform="Any CPU" /p:RestoreIgnoreFailedSources=false /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate single-file deliverables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($project in @("SimoSim", "SimoMaster")) {
            $out = Join-Path $project "bin/Release"
            $exe = Join-Path $out "$project.exe"
            if (!(Test-Path $exe)) { throw "Missing $exe" }
            $deps = @("HMI.Controls.dll", "EasyModbus.dll", "NModbus4.dll")
            foreach ($dep in $deps) {
              $candidate = Join-Path $out $dep
              if (!(Test-Path $candidate)) { continue }
              # A dependency DLL left beside the EXE means single-file packaging was not verified.
              # Costura can leave input copies in bin; test embedded resources below instead.
            }
            $content = [IO.File]::ReadAllBytes((Resolve-Path $exe))
            $markers = @("costura.", "Costura.")
            $ascii = [Text.Encoding]::ASCII.GetString($content)
            if (-not ($markers | Where-Object { $ascii.Contains($_) })) {
              throw "$project.exe does not appear to contain Costura resources. Refusing portable release."
            }
            Copy-Item $exe (Join-Path dist "$project.exe")
          }
          Get-ChildItem dist | Format-Table Name,Length

      - name: Upload portable EXEs
        uses: actions/upload-artifact@v4
        with:
          name: SimoSim-Modbus-Portable
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Windows portable applications: SimoSim.exe and SimoMaster.exe.
            Requires Microsoft .NET Framework 4.8 or newer installed on Windows.
            Built from the tagged commit. No installer required.
